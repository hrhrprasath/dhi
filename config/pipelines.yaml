pipelines:
  - name: stocks
    description: Stock queries with news (stock, share, nifty, sensex, mutual fund, investing, buy, sell) anything related to stocks fundamental live stock data and related news
    weight: 0.8
    params:
      - name: company
        required: true
        extract_hint: "Extract company name, stock symbol, or index from the input (e.g., 'nifty50', 'apple', 'reliance')"
    action:
      type: bash
      script: "scripts/stock {company}"

  - name: search_inline
    description: Search web and display results inline — use for any question that needs live/fresh information (search, find, what is, how to, google, tell me about, tell me, summarize, explain, what is, who is, when did, where is, lookup, research)
    weight: 0.7
    params:
      - name: query
        required: true
        extract_hint: "Extract the search query or topic from the user input (e.g., 'latest AI news 2026', 'how to cook pasta', 'tell me about black holes')"
    action:
      type: bash
      summarize: true
      summarize_ignore_context: true
      script: "scripts/search_inline {query}"

  - name: search_browser
    description: Open a website or search in default browser — only when explicitly asked to open/open in browser (open youtube, open wikipedia, open in browser)
    weight: 0.3
    params:
      - name: query
        required: true
      - name: provider
        required: false
        default: duckduckgo
    action:
      type: bash
      script: "scripts/search_browser {provider} {query}"

  - name: browse
    description: Read a webpage content inline (read article, open page, fetch url, get website)
    weight: 0.4
    params:
      - name: url
        required: true
    action:
      type: bash
      summarize: true
      script: "scripts/browse {url}"

  - name: music
    description: Music playback/search (play, song, music, podcast, spotify) — opens Spotify and searches for the query
    weight: 0.5
    params:
      - name: query
        required: true
        extract_hint: "Extract the song name, artist, or podcast to search on Spotify"
    action:
      type: bash
      script: "scripts/spotify {query}"

  - name: open_browser
    description: Open any URL or website in the default browser (open, open browser, visit, go to, launch, show me, take me to)
    weight: 0.4
    params:
      - name: url
        required: true
        extract_hint: "Extract the full URL or website name from the user input (e.g., 'https://github.com', 'youtube.com', 'reddit')"
    action:
      type: bash
      script: "scripts/open_browser {url}"


