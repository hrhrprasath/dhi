# DHI Pipeline Configuration
# Each pipeline defines:
# - name: pipeline identifier
# - description: what it handles (keywords for LLM routing)
# - params: parameters to extract
# - action: what to execute
# - summarizer: prompt for LLM to summarize output
#
# Action types:
# - http: HTTP request (url, method, optional auth)
# - exec: execute binary (command, args)
# - bash: run bash script (script)
# - open: open URL/app (target)
# - internal: internal handler (handler name)

pipelines:
  - name: stocks
    description: Stock queries with news (stock, share, nifty, sensex, mutual fund, investing, buy, sell) anything related to stocks fundamental live stock data and related news
    params:
      - name: company
        required: true
        extract_hint: "Extract company name, stock symbol, or index from the input (e.g., 'nifty50', 'apple', 'reliance')"
    action:
      type: bash
      script: "scripts/stock {company}"
    summarizer:
      prompt: "Summarize stock data into 2-3 sentences highlighting price, change, and key metrics."

  - name: ollama_search
    description: Web search (search, find, what is, how to, google)
    params:
      - name: query
        required: true
      - name: count
        required: false
        default: 5
    action:
      type: http
      url: "https://duckduckgo.com/html/?q={query}"
      method: GET
    summarizer:
      prompt: "Provide a brief summary of the top 3 search results."

  - name: expense
    description: Expense tracking (expense, spent, bought, cost, price)
    params:
      - name: amount
        required: true
      - name: category
        required: false
        default: misc
      - name: description
        required: false
    action:
      type: internal
      handler: expense_log
    summarizer:
      prompt: "Confirm the expense was logged with amount and category."

  - name: health
    description: Health tracking (health, workout, exercise, steps, sleep)
    params:
      - name: action
        required: false
        default: check
      - name: metric
        required: false
    action:
      type: internal
      handler: health_tracker
    summarizer:
      prompt: "Provide a brief health summary with key metrics."

  - name: music
    description: Music playback/search (play, song, music, podcast)
    params:
      - name: query
        required: true
      - name: service
        required: false
        default: spotify
    action:
      type: exec
      command: "spotify-cli"
      args: ["search", "{query}"]
    summarizer:
      prompt: "List the top 3 search results with song name and artist."

  - name: history
    description: Search past conversations/decisions (what did I, remember, earlier, before, past, decision, discussed, talked about)
    params:
      - name: query
        required: true
      - name: date_filter
        required: false
        default: all
      - name: depth
        required: false
        default: 1
    action:
      type: internal
      handler: memory_grep
    summarizer:
      prompt: "Synthesize findings using 3-level thought: (1) Direct matches with context, (2) Related concepts found in loop, (3) Timeline synthesis connecting past entries. Format as: [Direct Answer] + [Related Context] + [Timeline]"

  - name: conversation
    description: Continue/clarify existing conversation (continue, clarify, more, explain, earlier response)
    params:
      - name: topic
        required: true
      - name: last_context
        required: false
    action:
      type: internal
      handler: conversation_continue
    summarizer:
      prompt: "Provide contextual continuation building on the previous exchange."
