pipelines:
  - name: stocks
    description: Stock queries with news (stock, share, nifty, sensex, mutual fund, investing, buy, sell) anything related to stocks fundamental live stock data and related news
    params:
      - name: company
        required: true
        extract_hint: "Extract company name, stock symbol, or index from the input (e.g., 'nifty50', 'apple', 'reliance')"
    action:
      type: bash
      script: "scripts/stock {company}"

  - name: search_inline
    description: Search web and display results in terminal (search, find, what is, how to, google)
    params:
      - name: query
        required: true
    action:
      type: bash
      summarize: true
      script: "scripts/search_inline {query}"

  - name: search_browser
    description: Open a website or search in default browser — only when explicitly asked to open/open in browser (open youtube, open wikipedia, open in browser)
    params:
      - name: query
        required: true
      - name: provider
        required: false
        default: duckduckgo
    action:
      type: bash
      script: "scripts/search_browser {provider} {query}"

  - name: browse
    description: Read a webpage content inline (read article, open page, fetch url, get website)
    params:
      - name: url
        required: true
    action:
      type: bash
      summarize: true
      script: "scripts/browse {url}"

  - name: system
    description: System metrics and observability (system info, metrics, status, cpu, ram, uptime, kernel)
    params:
      - name: metric
        required: false
        default: all
    action:
      type: internal
      handler: system_metrics

  - name: todo
    description: Create and manage todos/reminders (track, remind, todo, task, remember, follow up)
    params:
      - name: action
        required: false
        default: list
      - name: text
        required: false
        extract_hint: "Extract the task description from the user input (e.g., 'buy milk', 'call john', 'pay bill at 5pm')"
    action:
      type: internal
      handler: todo
