# DHI Pipeline Configuration
# Each pipeline defines:
# - name: pipeline identifier
# - description: what it handles (keywords for LLM routing)
# - params: parameters to extract
# - action: what to execute
#
# Action types:
# - http: HTTP request (url, method, optional auth)
# - exec: execute binary (command, args)
# - bash: run bash script (script)
# - open: open URL/app (target)
# - internal: internal handler (handler name)

pipelines:
  - name: stocks
    description: Stock queries with news (stock, share, nifty, sensex, mutual fund, investing, buy, sell) anything related to stocks fundamental live stock data and related news
    params:
      - name: company
        required: true
        extract_hint: "Extract company name, stock symbol, or index from the input (e.g., 'nifty50', 'apple', 'reliance')"
    action:
      type: bash
      script: "scripts/stock {company}"

  - name: search_inline
    description: Search web and display results in terminal (search, find, what is, how to, google)
    params:
      - name: query
        required: true
    action:
      type: bash
      script: "scripts/search_inline {query}"

  - name: search_browser
    description: Open web search in default browser (search in browser, open youtube, open wikipedia, look up)
    params:
      - name: query
        required: true
      - name: provider
        required: false
        default: duckduckgo
    action:
      type: bash
      script: "scripts/search_browser {provider} {query}"

  - name: browse
    description: Read a webpage content inline (read article, open page, fetch url, get website)
    params:
      - name: url
        required: true
    action:
      type: bash
      script: "scripts/browse {url}"

  - name: expense
    description: Expense tracking (expense, spent, bought, cost, price)
    params:
      - name: amount
        required: true
      - name: category
        required: false
        default: misc
      - name: description
        required: false
    action:
      type: internal
      handler: expense_log

  - name: health
    description: Health tracking (health, workout, exercise, steps, sleep)
    params:
      - name: action
        required: false
        default: check
      - name: metric
        required: false
    action:
      type: internal
      handler: health_tracker

  - name: music
    description: Music playback/search (play, song, music, podcast, spotify)
    params:
      - name: query
        required: true
    action:
      type: bash
      script: "scripts/spotify {query}"

  - name: history
    description: Search past conversations/decisions (what did I, remember, earlier, before, past, decision, discussed, talked about)
    params:
      - name: query
        required: true
      - name: date_filter
        required: false
        default: all
      - name: depth
        required: false
        default: 1
    action:
      type: internal
      handler: memory_grep

  - name: conversation
    description: Continue/clarify existing conversation (continue, clarify, more, explain, earlier response)
    params:
      - name: topic
        required: true
      - name: last_context
        required: false
    action:
      type: internal
      handler: conversation_continue
